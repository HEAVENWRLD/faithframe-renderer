name: FFmpeg Short Production Render

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Opaque Cloudflare render task UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gospel-short-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render one private Gospel Inspiration Short
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the renderer
        uses: actions/checkout@v4

      - name: Install FFmpeg and font support
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --yes ffmpeg fonts-dejavu-core librsvg2-bin
          ffmpeg -version
          ffprobe -version

      - name: Validate renderer Python files
        run: python3 -m py_compile renderer/render_short.py renderer/worker.py

      - name: Download, render and return the private MP4 through Cloudflare
        env:
          RENDER_TASK_ID: ${{ inputs.task_id }}
          RENDER_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
          FFMPEG_WORKER_TOKEN: ${{ secrets.FFMPEG_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_BASE_URL"
          test -n "$FFMPEG_WORKER_TOKEN"
          for attempt in 1 2 3; do
            echo "Short render attempt $attempt of 3"
            if python3 renderer/worker.py --task-id "$RENDER_TASK_ID"; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 3 ]; then
              echo "Short render stopped after attempt $attempt with exit code $status."
              exit "$status"
            fi
            delay=$((attempt * 20))
            echo "Transient render failure. Cloudflare task state will be safely advanced before the next attempt; waiting ${delay}s."
            sleep "$delay"
          done
