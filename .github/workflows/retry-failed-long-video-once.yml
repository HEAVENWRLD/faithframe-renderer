name: Retry Failed Gospel Long Video Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retry-failed-long-video-once.yml"

permissions:
  contents: read

jobs:
  dispatch:
    name: Safely redispatch the existing failed long-video task
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the existing long-video task with the updated renderer
        env:
          GH_TOKEN: ${{ secrets.RENDER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/HEAVENWRLD/faithframe-renderer/actions/workflows/ffmpeg-long-production-render.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main","inputs":{"task_id":"ee6712d1-0734-413d-94d1-49ef89902eb3"}}'
