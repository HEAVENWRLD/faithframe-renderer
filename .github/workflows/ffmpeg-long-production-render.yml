name: FFmpeg Long Production Render

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Opaque Cloudflare long-video task UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gospel-long-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Generate and render one 12-section long video
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out the renderer
        uses: actions/checkout@v4

      - name: Install FFmpeg, fonts and SVG support
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --yes ffmpeg fonts-dejavu-core librsvg2-bin
          ffmpeg -version
          ffprobe -version

      - name: Validate long renderer Python files
        run: python3 -m py_compile renderer/render_long.py renderer/long_worker.py

      - name: Generate media, render and return the long MP4 through Cloudflare
        env:
          RENDER_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
          FFMPEG_WORKER_TOKEN: ${{ secrets.FFMPEG_WORKER_TOKEN }}
          RENDER_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_BASE_URL"
          test -n "$FFMPEG_WORKER_TOKEN"
          for attempt in 1 2 3; do
            echo "Long-video render attempt $attempt of 3"
            if python3 renderer/long_worker.py --task-id "$RENDER_TASK_ID"; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -ne 75 ] || [ "$attempt" -eq 3 ]; then
              echo "Render stopped after attempt $attempt with exit code $status."
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "Transient render failure. Cloudflare task state will be safely advanced before the next attempt; waiting ${delay}s."
            sleep "$delay"
          done
